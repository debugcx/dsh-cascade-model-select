# dsh-cascade-model-select bundle patch.
#
# 1. Mount the cascade model selector plugin (this package).
# 2. Disable the built-in flat grouped selector (ui-model-selection) so the
#    composer model seat and the /model command have exactly one owner.
#    Removing or disabling this bundle restores the built-in selector.
- insert:
    - id: cascade-model-select
      name: dsh-cascade-model-select

- id: ui-model-selection
  name: '@deepseek-ai/dsh-client-ui-model-selection'
  disabled: true
